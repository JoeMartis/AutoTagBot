<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoTagBot &mdash; Batch PDF Accessibility</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main>
      <header>
        <h1>AutoTagBot</h1>
        <p class="sub">Batch-run Adobe Auto-Tag &amp; Accessibility Checker on PDFs.</p>
      </header>

      <form id="batch-form">
        <section class="card">
          <h2>1. Adobe credentials</h2>
          <p class="hint">
            Not stored. Used only for this batch and discarded when the response is sent.
          </p>
          <label>
            <span>client_id</span>
            <input type="password" name="clientId" autocomplete="off" required />
          </label>
          <label>
            <span>client_secret</span>
            <input type="password" name="clientSecret" autocomplete="off" required />
          </label>
        </section>

        <section class="card">
          <h2>2. Options</h2>
          <div class="grid">
            <label class="check">
              <input type="checkbox" name="runAccessibilityChecker" checked />
              Run Accessibility Checker after tagging
            </label>
            <label class="check">
              <input type="checkbox" name="generateReport" />
              Generate XLSX tagging report
            </label>
            <label class="check">
              <input type="checkbox" name="shiftHeadings" />
              Shift headings (WCAG-friendly)
            </label>
          </div>
          <div class="grid two" id="page-range">
            <label>
              <span>Page start (checker, optional)</span>
              <input type="number" name="pageStart" min="1" placeholder="1" />
            </label>
            <label>
              <span>Page end (checker, optional)</span>
              <input type="number" name="pageEnd" min="1" placeholder="last" />
            </label>
          </div>
        </section>

        <section class="card">
          <h2>3. Files &amp; naming</h2>
          <label class="filedrop">
            <input type="file" id="files" name="files" accept="application/pdf" multiple />
            <span>Drop PDFs here or click to choose</span>
          </label>

          <label>
            <span>Batch name pattern</span>
            <input type="text" id="pattern" name="namePattern" value="{name}-tagged" />
            <small class="hint"><code>{name}</code> = original filename without extension. Applied to any file you don't rename below.</small>
          </label>

          <div id="file-list"></div>
        </section>

        <button id="submit-btn" type="submit">Run batch</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>

      <footer>
        <small>
          Adobe APIs:
          <a href="https://developer.adobe.com/document-services/docs/overview/pdf-accessibility-auto-tag-api/" target="_blank" rel="noopener">Auto-Tag</a>
          &middot;
          <a href="https://developer.adobe.com/document-services/docs/overview/pdf-services-api/howtos/pdf-accessibility-checker-api/" target="_blank" rel="noopener">Accessibility Checker</a>
        </small>
      </footer>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
